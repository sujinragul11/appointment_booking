server:
  port: 8080

spring:
  application:
    name: booking-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/booking_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET:bXktc3VwZXItc2VjdXJlLXNlY3JldC1rZXktZm9yLWFwcG9pbnRtZW50LWJvb2tpbmctcGxhdGZvcm0tMjAyNi0yNDktYnl0ZXM=}
    expiration-ms: 3600000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_demo}
    key-secret: ${RAZORPAY_KEY_SECRET:demo}
  app-url: ${APP_URL:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:admin@booking.com}
    password: ${ADMIN_PASSWORD:Admin@123}

logging:
  level:
    com.booking: INFO
    org.hibernate.SQL: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui.html