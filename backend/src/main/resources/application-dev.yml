# Zero-setup local profile: in-memory H2 (PostgreSQL mode). The database starts empty on every run;
# set ADMIN_EMAIL / ADMIN_PASSWORD to have the first admin account created at startup.
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring:
  datasource:
    url: jdbc:h2:mem:bookingdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    allow-ephemeral-secret: true
  payments:
    demo-mode: ${PAYMENTS_DEMO_MODE:true}
  security:
    rate-limit:
      enabled: false

logging:
  level:
    com.booking: DEBUG
